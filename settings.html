<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile & Settings — HireTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html"><span class="brand-mark">♥</span><span>HireTrack</span></a>
      <nav class="side-nav">
        <a href="dashboard.html"><span>⌂</span>Dashboard</a>
        <a href="applications.html"><span>▣</span>Applications</a>
        <a class="active" href="settings.html"><span>⚙</span>Settings</a>
      </nav>
      <div class="sidebar-user"><div class="avatar">S</div><div><strong>Sakshi Shandilya</strong><small>3rd Year CSE</small></div></div>
    </aside>

    <main class="app-main">
      <div class="topbar"><div><h1>Profile & Settings</h1><p>Manage your account and preferences.</p></div></div>
      <section class="panel profile-card">
        <div class="profile-head"><div class="profile-avatar">S</div><div><h2>Sakshi Shandilya</h2><p>sakshi@example.com</p></div><button class="btn btn-secondary">Edit Profile</button></div>
        <div class="form-grid">
          <label>Preferred Role<select><option>Software Engineering Intern</option><option>Frontend Intern</option><option>Data Analyst Intern</option></select></label>
          <label>Preferred Location<select><option>Bengaluru, India</option><option>Remote</option><option>Mumbai, India</option></select></label>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Theme preference</h2></div>
        <div class="theme-toggle"><button class="active" data-theme="light">☼ Light</button><button data-theme="dark">☾ Dark</button></div>
      </section>

      <section class="panel danger-panel">
        <div><h2>Data Management</h2><p>Clear all local data saved in this demo.</p></div>
        <button class="btn btn-danger" id="clearData">Clear Data</button>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
